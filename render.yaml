# ============================================================
# Render.com デプロイ設定ファイル (AdMu)
# https://render.com でGitHubリポジトリに接続後、
# このファイルが自動検出されデプロイに使用されます
# ============================================================
services:
  - type: web
    name: admu-backend
    runtime: python
  rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # 外販するなら plan: starter ($7/月) 推奨 (free はスリープあり)
    plan: starter
    healthCheckPath: /health
    envVars:
      # --- データベース ---
      - key: DATABASE_URL
        fromDatabase:
          name: admu-db
          property: connectionString
      # --- アプリ ---
      - key: MOCK_ADS_API
        value: "true"
      - key: PORT
        value: "8001"
      # --- 認証 ---
      - key: JWT_SECRET
        generateValue: true       # Renderが自動生成
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false               # Renderダッシュボードで入力
      - key: ADMIN_PASSWORD
        sync: false               # Renderダッシュボードで入力
      - key: ADMIN_INIT_SECRET
        sync: false               # 初回セットアップ用シークレット
      # --- AI ---
      - key: GEMINI_API_KEY
        sync: false
      # --- Google Ads API ---
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_DEFAULT_CUSTOMER_ID
        sync: false
      # --- LINE ---
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_DEFAULT_USER_ID
        sync: false
      # --- メール (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      # --- LOGICTION連携 ---
      - key: LOGICTION_BASE_URL
        sync: false
      - key: INTEGRATION_SECRET_KEY
        sync: false

databases:
  - name: admu-db
    plan: free   # 無料プラン (256MB / 90日後自動削除)
    # plan: starter  # $7/月 (1GB, 永続) ← 本番推奨

# --- LP (ランディングページ) ---
staticSites:
  - type: static
    name: admu-lp
    buildCommand: echo "No build needed"
    staticPublishPath: ./lp
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
