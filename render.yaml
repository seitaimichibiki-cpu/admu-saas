services:
  - type: web
    name: admu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: admu-db
          property: connectionString
      - key: MOCK_ADS_API
        value: "true"
      - key: PORT
        value: "10000"
      - key: APP_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

static_sites:
  - name: admu-lp
    buildCommand: echo "No build needed"
    staticPublishPath: ./lp
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: admu-db
    plan: starter
